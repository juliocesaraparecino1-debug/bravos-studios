<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Post Bravos Vox</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@600;700&family=Caveat:wght@700&display=block" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--or:#F87F23;--yel:#F6C93B;--navy:#14213D;--coral:#EF5B4C;--paper:#FBF6EA}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--yel)}
/* halftone + grain */
.ht{position:absolute;inset:0;background-image:radial-gradient(rgba(180,120,0,.28) 2.6px,transparent 3.2px);background-size:18px 18px;
 -webkit-mask-image:linear-gradient(160deg,#000 0%,transparent 70%);mask-image:linear-gradient(160deg,#000 0%,transparent 70%)}
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;pointer-events:none}
/* navy torn block */
.navy{position:absolute;left:-20px;right:-20px;top:860px;bottom:-20px;background:var(--navy);
 clip-path:polygon(0 8%,6% 4%,13% 9%,21% 3%,30% 8%,38% 2%,47% 7%,56% 3%,66% 9%,75% 4%,84% 8%,92% 3%,100% 7%,100% 100%,0 100%)}
.navy:after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2.4px,transparent 3px);background-size:16px 16px}
.coral{position:absolute;left:-40px;top:780px;width:520px;height:120px;background:var(--coral);transform:rotate(-3deg)}
.top{position:absolute;left:80px;top:64px;display:flex;flex-direction:column;align-items:center;line-height:1}
.top img{height:44px}
.top span{font:700 14px 'Bricolage Grotesque';letter-spacing:.42em;color:var(--navy);margin-top:5px;padding-left:.42em}
.tag{position:absolute;right:80px;top:76px;font:700 22px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
h1{position:absolute;left:80px;right:70px;top:170px;font:800 112px/.98 'Bricolage Grotesque';letter-spacing:-.035em;color:var(--ink)}
h1 .mk{position:relative;display:inline-block;color:var(--ink)}
h1 .mk svg{position:absolute;left:-34px;top:-24px;width:calc(100% + 68px);height:calc(100% + 50px);overflow:visible}
/* cutouts */
.cut{position:absolute;background:#fff;padding:16px;box-shadow:0 18px 34px rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.1)}
.cut img{display:block;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;width:150px;height:44px;background:rgba(255,236,170,.82);box-shadow:0 2px 6px rgba(0,0,0,.18);
 background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.04) 6px 7px)}
.sticker{position:absolute;filter:drop-shadow(0 0 0 #fff) drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(4px 4px 0 #fff) drop-shadow(-4px -4px 0 #fff) drop-shadow(4px -4px 0 #fff) drop-shadow(-4px 4px 0 #fff) drop-shadow(0 22px 24px rgba(0,0,0,.45))}
.note{position:absolute;font:700 46px Caveat,cursive;color:var(--coral);transform:rotate(-6deg);line-height:1}
.label{position:absolute;background:var(--ink);color:#fff;font:700 30px Inter;padding:14px 26px;letter-spacing:.02em}
.foot{position:absolute;left:80px;right:80px;bottom:60px;display:flex;justify-content:space-between;font:600 28px Inter;color:#fff}
.foot b{color:var(--or)}
</style></head><body>
<section class="post" id="post-1">
 <div class="ht"></div>
 <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .9 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

 <div class="top"><img src="assets/bravos-word-dark.png"><span>STUDIOS</span></div>
 <div class="tag">Identidade · Site · Social</div>

 <h1>Sua marca não pode ser <span class="mk">só mais uma.
  <svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M20 58 C 10 18, 150 6, 260 12 C 360 18, 398 46, 380 72 C 352 100, 190 98, 90 88 C 30 82, 4 62, 22 40" fill="none" stroke="#EF5B4C" stroke-width="7" stroke-linecap="round"/></svg></span></h1>

 <div class="navy"></div>
 <div class="coral"></div>

 <div class="cut" style="left:70px;top:560px;width:560px;height:400px;transform:rotate(-4deg)"><img src="assets/campanha-streetwear.webp" style="object-position:40% 40%"></div>
 <div class="tape" style="left:260px;top:540px;transform:rotate(-8deg)"></div>

 <div class="cut" style="left:690px;top:520px;width:300px;height:560px;transform:rotate(5deg);padding:14px"><img src="assets/04-metricas-visao-geral.webp" style="object-position:top"></div>
 <div class="tape" style="left:770px;top:500px;transform:rotate(6deg)"></div>

 <img class="sticker" src="assets/mascote.webp" style="left:300px;top:840px;width:380px">

 <div class="label" style="left:70px;top:1010px;transform:rotate(-3deg)">Marca forte vende mais.</div>
 <div class="note" style="left:70px;top:1100px">design que se<br>faz notar →</div>

 <div class="foot"><span>@bravos_studios</span><span><b>●</b> bravosstudio.digital</span></div>
</section></body></html>
