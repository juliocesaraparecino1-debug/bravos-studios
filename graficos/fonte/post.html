<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Post Bravos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--or:#F87F23}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc}
.post{position:relative;width:1080px;height:1350px;background:var(--or);overflow:hidden}
.top{position:absolute;left:80px;top:70px;display:flex;flex-direction:column;align-items:center;line-height:1}
.top img{height:44px}
.top span{font:700 14px 'Bricolage Grotesque';letter-spacing:.42em;color:#fff;margin-top:5px;padding-left:.42em}
.eyebrow{position:absolute;left:80px;top:200px;font:700 24px Inter;letter-spacing:.14em;text-transform:uppercase;color:#fff}
h1{position:absolute;left:80px;right:80px;top:250px;font:700 124px/.96 'Bricolage Grotesque';letter-spacing:-.035em;color:var(--ink)}
h1 em{font-style:normal;color:#fff}
.disk{position:absolute;left:190px;top:800px;width:700px;height:700px;border-radius:50%;background:var(--ink)}
.mascote{position:absolute;left:260px;top:600px;width:560px}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;font:600 28px Inter;color:#fff}
</style></head><body>
<section class="post" id="post-1">
 <div class="top"><img src="assets/bravos-word-dark.png"><span>STUDIOS</span></div>
 <div class="eyebrow">Design · Sites · Mídias digitais</div>
 <h1>Sua marca com <em>cara de grande.</em></h1>
 <div class="disk"></div>
 <img class="mascote" src="assets/mascote.webp">
 <div class="foot"><span>@bravos_studios</span><span>bravosstudio.digital</span></div>
</section></body></html>
