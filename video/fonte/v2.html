<style>
:root{--ink:#0B0B0C;--or:#F87F23;--gray:#9A968F;--soft:#F3F2EF;--line:#E6E4E0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:'Bricolage Grotesque',sans-serif;color:var(--ink)}
.abs{position:absolute}.full{position:absolute;inset:0}
.scene{position:absolute;inset:0;visibility:hidden}
.line{position:absolute;left:60px;right:60px;text-align:center;font-weight:600;letter-spacing:-.03em;line-height:1.02}
.wd{display:inline-block;margin:0 .11em;opacity:0;will-change:transform,filter}
.or{color:var(--or)} .gr{color:var(--gray)}
.vis{visibility:hidden;opacity:0}
.pill{display:inline-flex;align-items:center;gap:16px;padding:.18em .55em;border-radius:999px;background:var(--ink);color:#fff}
.pill.o{background:var(--or);color:#fff}
.bub{position:absolute;width:150px;height:150px;border-radius:50%;background:var(--soft);display:grid;place-items:center;box-shadow:0 20px 40px rgba(0,0,0,.08)}
.bub svg{width:76px;height:76px;fill:none;stroke:var(--or);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lphone{position:absolute;width:470px;height:1018px;border-radius:72px;background:#fff;padding:14px;box-shadow:0 0 0 2px var(--line),0 50px 100px rgba(0,0,0,.14)}
.lphone .scr{width:100%;height:100%;border-radius:60px;overflow:hidden;background:#eee;position:relative}
.lphone .scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.lphone .isl{position:absolute;top:28px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#0B0B0C;z-index:3}
.card{position:absolute;border-radius:40px;background:#fff;box-shadow:0 0 0 2px var(--line),0 40px 80px rgba(0,0,0,.10);overflow:hidden}
.dots{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:16px}
.dots i{display:block;width:18px;height:18px;border-radius:50%;background:#D9D6D0}
.tog{position:absolute;width:180px;height:100px;border-radius:50px;background:#D9D6D0}
.tog i{position:absolute;left:10px;top:10px;width:80px;height:80px;border-radius:50%;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.tag{position:absolute;padding:22px 40px;border-radius:30px;background:var(--ink);color:#fff;font:600 64px 'Bricolage Grotesque';letter-spacing:-.02em}
.tag:after{content:'';position:absolute;left:50%;bottom:-22px;margin-left:-22px;border:22px solid transparent;border-top-color:var(--ink);border-bottom:0}
.lab{position:absolute;left:0;right:0;text-align:center;font:600 60px 'Bricolage Grotesque';letter-spacing:-.02em}
.cursor{position:absolute;width:110px;height:110px}
.ripple{position:absolute;border-radius:50%;border:6px solid var(--or);opacity:0}
</style></head>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const VO=0.4, FPS=30, END=64.3;
const T=x=>x+VO;
let AMP=[], WORDS=[];
const SFX=[]; const sfx=(t,f,v=1)=>SFX.push({t:+t.toFixed(3),f,v});
const $=id=>document.getElementById(id);
const tl=gsap.timeline({paused:true});
const ws=i=>T(WORDS[i].s)-0.04;
const MB=[]; // motion-blurred elements
function mb(el){el=typeof el==='string'?$(el):el;const id='f'+MB.length;$('fdefs').insertAdjacentHTML('beforeend',`<filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>`);MB.push({el,g:document.querySelector('#'+id+' feGaussianBlur'),id});return el}

// word-by-word phrase. opts: cls map {idx:'or'|'pill'|...}, text overrides
function phrase(id,i0,i1,o={}){
  const box=$(id); const spans=[];
  for(let i=i0;i<=i1;i++){const s=document.createElement('span');s.className='wd '+(o.cls?.[i]||'');
    let tx=(o.txt?.[i]??WORDS[i].w); if(o.strip) tx=tx.replace(/[.,!?]$/,'');
    s.innerHTML=o.cls?.[i]==='pill'?`<span class="pill">${tx}</span>`:o.cls?.[i]==='pillo'?`<span class="pill o">${tx}</span>`:tx; box.appendChild(s); if(o.br?.includes(i)) box.appendChild(document.createElement('br'));
    spans.push(s);
    tl.fromTo(s,{opacity:0,x:46,filter:'blur(14px)'},{opacity:1,x:0,filter:'blur(0px)',duration:.24,ease:'power3.out',immediateRender:false},ws(i));
  }
  return spans;
}
function out(sel,at,dx=-120){tl.to(sel,{autoAlpha:0,x:dx,filter:'blur(16px)',duration:.22,ease:'power2.in'},at)}
function pop(sel,at,o={}){tl.fromTo(sel,{autoAlpha:0,scale:o.s??.4,y:o.y??40},{autoAlpha:1,scale:1,y:0,duration:o.d||.4,ease:o.e||'back.out(2)',immediateRender:false},at); if(o.sfx!==false) sfx(at,o.sfx||'pop',o.v||.35)}
function blurIn(sel,at,o={}){tl.fromTo(sel,{autoAlpha:0,scale:o.s??1.4,filter:'blur(18px)'},{autoAlpha:1,scale:1,filter:'blur(0px)',duration:o.d||.38,ease:'expo.out',immediateRender:false},at); if(o.sfx) sfx(at,o.sfx,o.v||.5)}
function sceneIn(id,at){tl.set('#'+id,{visibility:'visible'},at);tl.fromTo('#'+id,{x:1080},{x:0,duration:.42,ease:'expo.inOut',immediateRender:false},at);sfx(at+.02,'whoosh'+(1+(SFX.length%3)),.45)}
function sceneOut(id,at){tl.to('#'+id,{x:-1080,duration:.42,ease:'expo.inOut'},at);tl.set('#'+id,{visibility:'hidden'},at+.43)}
function punch(at,a=.03){tl.fromTo('#cam',{scale:1+a},{scale:1,duration:.4,ease:'power3.out',immediateRender:false},at)}
function echo(host,text,top,size,at,o={}){ // stacked fading copies
  const h=$(host); const els=[];
  for(let k=0;k<3;k++){const d=document.createElement('div');d.className='line vis '+(k===0&&o.cls?o.cls:'');d.style.cssText+=`top:${top+k*size*.95}px;font-size:${size}px;opacity:0;color:${k?['','#C9C6C0','#E4E2DE'][k]:''}`;d.textContent=text;h.appendChild(d);els.push(d);
    tl.fromTo(d,{autoAlpha:0,y:-size*.6*k,filter:'blur(10px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:.3,ease:'power3.out',immediateRender:false},at+k*.07);}
  return els;
}
function toggle(id,at){const t=$(id);pop('#'+id,at-.25,{s:.6,y:0,sfx:false});tl.to(t,{background:'#F87F23',duration:.15},at);tl.to(t.querySelector('i'),{x:80,duration:.22,ease:'back.out(2)'},at);sfx(at,'pop',.45)}
function drawSvg(sel,at,d=.45){tl.to(sel,{strokeDashoffset:0,duration:d,ease:'power2.inOut'},at)}
function lphone(parent,x,src,id){const d=document.createElement('div');d.className='lphone';d.style.left=x+'px';d.style.top='0px';d.innerHTML=`<div class="isl"></div><div class="scr"><img ${id?`id="${id}"`:''} src="${src}"></div>`;$(parent).appendChild(d);return d}
function setDots(id,n,at){tl.to(`#${id} i`,{background:'#D9D6D0',width:18,duration:.15},at);tl.to(`#${id} i:nth-child(${n})`,{background:'#F87F23',width:46,borderRadius:9,duration:.2},at)}
function label(id,txt,at){tl.to('#'+id,{autoAlpha:0,y:-20,filter:'blur(8px)',duration:.1},at-.1);tl.set('#'+id,{innerHTML:txt},at);tl.fromTo('#'+id,{autoAlpha:0,y:30,filter:'blur(10px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:.25,ease:'power3.out',immediateRender:false},at)}
const ICON={cal:'<path d="M3 5h18v16H3zM16 3v4M8 3v4M3 10h18"/>'};

function build(){
 [ 's1','s2','s3','s4','s5','s6','s7','s8','s9','s10'].forEach(s=>mb(s));
 // ===== S1 =====
 tl.set('#s1',{visibility:'visible'},0);
 tl.fromTo('#disk1',{scale:0},{scale:1,duration:.5,ease:'back.out(1.6)'},0.05);
 tl.fromTo('#m1',{y:900},{y:0,duration:.55,ease:'back.out(1.4)'},T(-.2)); mb('m1');
 sfx(0.05,'whoosh2',.5); sfx(T(0),'impact1',.45);
 phrase('l1a',0,1,{cls:{1:'or'}});
 out('#l1a',ws(2)-.12);
 const sp=phrase('l1b',2,6,{cls:{4:'or'},br:[3,4]});
 tl.fromTo(sp[2],{y:-160},{y:0,duration:.35,ease:'power3.out',immediateRender:false},ws(4));

const SEQ=[{img:'seq6',dir:'cli',from:T(24.2),to:T(33.4),rate:1.6,n:671},
           {img:'seq6b',dir:'dono',from:T(33.6),to:T(37.6),rate:1.6,n:610},
           {img:'seq7',dir:'rg',from:T(38.8),to:T(43.5),rate:1.4,n:240}];
async function seqs(t){const jobs=[];for(const s of SEQ){if(t<s.from||t>=s.to)continue;const fr=Math.min(s.n,1+Math.floor((t-s.from)*FPS*s.rate));const src=`assets/seq/${s.dir}/${String(fr).padStart(4,'0')}.jpg`;const im=$(s.img);if(!im.src.endsWith(src)){im.src=src;jobs.push(im.decode().catch(()=>{}))}}await Promise.all(jobs)}
function puppet(t){
  const f=Math.floor((t-VO)*FPS), a=(f>=0&&f<AMP.length)?AMP[f]:0;
  const tr=`translateY(${(Math.sin(t*2.4)*8-a*10).toFixed(1)}px) rotate(${(Math.sin(t*5.1)*a*2).toFixed(2)}deg) scaleY(${(1+a*.015).toFixed(4)})`;
  $('m1b').style.transform=tr; $('m10b').style.transform=tr;
}
window.SFX=SFX; window.END=END;
window.renderAt=async function(t){
  const dt=1/60;
  tl.seek(Math.max(0,t-dt),false);
  const prev=MB.map(m=>{const r=m.el.getBoundingClientRect();return [r.left,r.top]});
  tl.seek(t,false);
  MB.forEach((m,k)=>{const r=m.el.getBoundingClientRect();const vx=Math.abs(r.left-prev[k][0]),vy=Math.abs(r.top-prev[k][1]);
    const bx=Math.min(60,vx*.9),by=Math.min(60,vy*.9);
    if(bx>0.6||by>0.6){m.g.setAttribute('stdDeviation',`${bx.toFixed(1)} ${by.toFixed(1)}`);m.el.style.filter=`url(#${m.id})`}else{m.el.style.filter='';}
  });
  $('drift').style.transform=`scale(${(1.02+Math.sin(t*.8)*.01).toFixed(4)}) rotate(${(Math.sin(t*.55)*.4).toFixed(3)}deg) translate(${(Math.sin(t*.6)*10).toFixed(1)}px,${(Math.cos(t*.45)*12).toFixed(1)}px)`;
  puppet(t);
  await seqs(t);
};

})();
