// =============== engine (frame-pure: every style is a function of t) ===============
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,u)=>a+(b-a)*u, P=(t,t0,d)=>cl((t-t0)/d);
const E={lin:x=>x,out:x=>x>=1?1:1-Math.pow(2,-10*x),in:x=>x<=0?0:Math.pow(2,10*x-10),
 io:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 q5:x=>1-Math.pow(1-x,5),spr:x=>x<=0?0:x>=1?1:1-Math.exp(-8*x)*Math.cos(8*x),sin:x=>-(Math.cos(Math.PI*x)-1)/2,
 back:x=>{const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};
const $=id=>document.getElementById(id);
function track(t,ks){ if(t<=ks[0][0]) return ks[0][1]; for(let i=1;i<ks.length;i++){ if(t<=ks[i][0]){const [t0,a]=ks[i-1],[t1,b,e]=ks[i];const u=(e||E.out)((t-t0)/(t1-t0)); return lerp(a,b,u);} } return ks[ks.length-1][1]; }

function mk(parent,css,html,cls){const d=document.createElement('div');d.className='abs '+(cls||'');d.style.cssText=css;if(html)d.innerHTML=html;parent.appendChild(d);return d}

function pose(e,t){const T=e.tr,g=(k,d)=>T[k]===undefined?d:(typeof T[k]==='number'?T[k]:track(t,T[k]));return{x:g('x',0),y:g('y',0),s:g('s',1),sx:g('sx',1),sy:g('sy',1),r:g('r',0),o:g('o',1),f:g('f',0)}}
